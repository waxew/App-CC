name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap Android source
        if: hashFiles('bootstrap.part.*') != ''
        shell: bash
        run: |
          cat bootstrap.part.* > /tmp/appcc-bootstrap.zip
          unzip -o /tmp/appcc-bootstrap.zip -d . || true
          cp bootstrap.cactus-release.jks app/cactus-release.jks
          test -s app/src/main/java/com/asteam/cactuscollection/CactusCollectionApp.kt
          test -s app/build.gradle.kts
          rm -f bootstrap.part.* bootstrap.cactus-release.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f app/cactus-release.jks
          git commit -m "feat: CACTUS Collection Android v1.0.0 [skip ci]" || true
          git push origin HEAD:main

      - name: Patch Compose compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          info = Path('app/src/main/java/com/asteam/cactuscollection/ScreensInfo.kt')
          if info.exists():
              text = info.read_text(encoding='utf-8')
              needle = 'import androidx.compose.foundation.background\n'
              if 'import androidx.compose.foundation.Image\n' not in text:
                  text = text.replace(needle, 'import androidx.compose.foundation.Image\n' + needle)
              info.write_text(text, encoding='utf-8')

          main = Path('app/src/main/java/com/asteam/cactuscollection/ScreensMain.kt')
          if main.exists():
              text = main.read_text(encoding='utf-8')
              text = text.replace('import androidx.compose.material3.NavigationBarItem\n', '')
              text = text.replace('import androidx.compose.material3.NavigationBarItemDefaults\n', '')
              start_marker = '@Composable\nprivate fun NavItem('
              end_marker = '\nprivate fun screenTitle('
              if start_marker in text and end_marker in text:
                  start = text.index(start_marker)
                  end = text.index(end_marker, start)
                  replacement = '''@Composable
          private fun NavItem(selected: Boolean, icon: ImageVector, label: String, onClick: () -> Unit) {
              Column(
                  modifier = Modifier.width(72.dp).clickable(onClick = onClick).padding(vertical = 8.dp),
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Box(
                      modifier = Modifier.size(34.dp).clip(CircleShape).background(if (selected) CactusLavender else Color.Transparent),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(icon, null, tint = if (selected) CactusPurple else CactusMuted, modifier = Modifier.size(22.dp))
                  }
                  Text(
                      label,
                      fontSize = 10.sp,
                      color = if (selected) CactusPurpleDark else CactusMuted,
                      fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal
                  )
              }
          }
          '''
                  text = text[:start] + replacement + text[end:]
              main.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/asteam/cactuscollection/ScreensInfo.kt app/src/main/java/com/asteam/cactuscollection/ScreensMain.kt
            git commit -m "fix: Compose release compatibility [skip ci]"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build-log.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify APK
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Copy distributable APK
        run: cp app/build/outputs/apk/release/app-release.apk CACTUS-Collection-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v1.0.0-apk
          path: CACTUS-Collection-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f CACTUS-Collection-v1.0.0.apk
          git commit -m "build: publish signed CACTUS Collection v1.0.0 APK [skip ci]" || true
          git push origin HEAD:main
