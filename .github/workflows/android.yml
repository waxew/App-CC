name: Build Android Publish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-cc-publish-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CACTUS v2 source package
        shell: bash
        run: |
          if [ -f bootstrap_v2.b64 ]; then
            base64 -d bootstrap_v2.b64 > /tmp/appcc-v2.zip
            unzip -o /tmp/appcc-v2.zip -d .
            rm -f bootstrap_v2.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: complete CACTUS Collection v2.0.0 local-first commerce [skip ci]" || true
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Build signed publish and debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean assembleRelease assembleDebug 2>&1 | tee build-log.txt

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintRelease 2>&1 | tee lint-log.txt

      - name: Verify publish APK and signing certificate
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee apk-signature.txt
          cp app/build/outputs/apk/release/app-release.apk CACTUS-Collection-v2.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk CACTUS-Collection-v2.0.0-debug.apk
          sha256sum CACTUS-Collection-v2.0.0.apk CACTUS-Collection-v2.0.0-debug.apk | tee apk-sha256.txt

      - name: Create source ZIP and project info
        shell: bash
        run: |
          rm -rf release-package CACTUS-Collection-v2.0.0-source.zip
          mkdir -p release-package/App-CC

          rsync -a ./ release-package/App-CC/ \
            --exclude '.git/' \
            --exclude '.gradle/' \
            --exclude 'release-package/' \
            --exclude 'app/build/' \
            --exclude 'build/' \
            --exclude '*.apk' \
            --exclude '*.zip' \
            --exclude 'build-log.txt' \
            --exclude 'lint-log.txt' \
            --exclude 'apk-signature.txt' \
            --exclude 'apk-sha256.txt'

          KEYSTORE_REPORT="$(keytool -list -v -keystore app/cactus-release.jks -alias cactus -storepass 'CactusCC2026!' -keypass 'CactusCC2026!' 2>&1)"
          SHA1_VALUE="$(printf '%s\n' "$KEYSTORE_REPORT" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          SHA256_VALUE="$(printf '%s\n' "$KEYSTORE_REPORT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          APK_SHA256="$(sha256sum CACTUS-Collection-v2.0.0.apk | awk '{print $1}')"

          cat > release-package/App-CC/info.txt <<EOF
          CACTUS Collection - Project Information
          =======================================

          App name: CACTUS Collection
          Publish version: 2.0.0
          versionCode: 3
          Application ID: com.asteam.cactuscollection
          Namespace: com.asteam.cactuscollection
          Language: Kotlin
          UI: Jetpack Compose + Material 3
          Compile SDK: 35
          Target SDK: 35
          Minimum SDK: 24
          Java/JVM: 17

          VERSION 2.0.0 CORE FEATURES
          ---------------------------
          - Local-first product catalog
          - Search
          - Persistent cart
          - Checkout and local order creation
          - Order history and reorder
          - Order sharing
          - Custom clothing design studio
          - Image picker for artwork
          - Saved design projects
          - Wholesale calculator with tiered discount
          - Loyalty points and levels
          - RTL drawer and correct Android back stack
          - Dynamic About Software version
          - Persian price formatting with thousands separators

          SIGNING / UPDATE COMPATIBILITY
          ------------------------------
          IMPORTANT: Do not lose or replace this keystore. Future Android updates must use the same signing identity.

          Keystore file: app/cactus-release.jks
          Key alias: cactus
          Keystore password: CactusCC2026!
          Key password: CactusCC2026!
          Certificate SHA-1: $SHA1_VALUE
          Certificate SHA-256: $SHA256_VALUE
          Publish APK SHA-256: $APK_SHA256

          BUILD COMMANDS
          --------------
          Publish APK:
          ./gradlew assembleRelease

          Debug APK:
          ./gradlew assembleDebug

          Lint:
          ./gradlew lintRelease

          Publish output:
          app/build/outputs/apk/release/app-release.apk

          Debug output:
          app/build/outputs/apk/debug/app-debug.apk

          REPOSITORY
          ----------
          waxew/App-CC

          IMPORTANT NOTES
          ---------------
          - Keep applicationId unchanged.
          - Increase versionCode for every published update.
          - Keep app/cactus-release.jks in secure backups.
          - This source archive contains signing material and must remain private.
          - OTP, payment gateway, cloud order synchronization, push notifications and live production status require real external service credentials and must never be implemented with fake secrets.
          EOF

          (cd release-package && zip -qry ../CACTUS-Collection-v2.0.0-source.zip App-CC)
          test -s CACTUS-Collection-v2.0.0-source.zip
          sha256sum CACTUS-Collection-v2.0.0-source.zip | tee source-sha256.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v2.0.0-diagnostics
          path: |
            build-log.txt
            lint-log.txt
            apk-signature.txt
            apk-sha256.txt
            source-sha256.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload publish APK
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v2.0.0-publish-apk
          path: CACTUS-Collection-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v2.0.0-debug-apk
          path: CACTUS-Collection-v2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v2.0.0-source
          path: CACTUS-Collection-v2.0.0-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APK to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f CACTUS-Collection-v2.0.0.apk
          git commit -m "build: publish CACTUS Collection v2.0.0 APK [skip ci]" || true
          git push origin HEAD:main
