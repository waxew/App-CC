name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap Android source
        if: hashFiles('bootstrap.part.*') != ''
        shell: bash
        run: |
          cat bootstrap.part.* > /tmp/appcc-bootstrap.zip
          unzip -o /tmp/appcc-bootstrap.zip -d . || true
          cp bootstrap.cactus-release.jks app/cactus-release.jks
          test -s app/src/main/java/com/asteam/cactuscollection/CactusCollectionApp.kt
          test -s app/build.gradle.kts
          rm -f bootstrap.part.* bootstrap.cactus-release.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f app/cactus-release.jks
          git commit -m "feat: CACTUS Collection Android v1.0.0" || true
          git push origin HEAD:main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build-log.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify APK
        run: test -f app/build/outputs/apk/release/app-release.apk

      - name: Copy distributable APK
        run: cp app/build/outputs/apk/release/app-release.apk CACTUS-Collection-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v1.0.0-apk
          path: CACTUS-Collection-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f CACTUS-Collection-v1.0.0.apk
          git commit -m "build: publish signed CACTUS Collection v1.0.0 APK" || true
          git push origin HEAD:main
