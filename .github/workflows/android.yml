name: Build Android Publish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-cc-publish-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply CACTUS v2 source package
        shell: bash
        run: |
          if compgen -G 'bootstrap_v2.part.*' > /dev/null; then
            cat $(printf '%s\n' bootstrap_v2.part.* | sort) | base64 -d > /tmp/appcc-v2.zip
            unzip -t /tmp/appcc-v2.zip
            unzip -o /tmp/appcc-v2.zip -d .
            rm -f bootstrap_v2.part.*
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: complete CACTUS Collection v2.0.0 local-first commerce [skip ci]" || true
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        shell: bash
        run: chmod +x gradlew

      - name: Build signed publish and debug APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean assembleRelease assembleDebug 2>&1 | tee build-log.txt

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintRelease 2>&1 | tee lint-log.txt

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee apk-signature.txt
          cp app/build/outputs/apk/release/app-release.apk CACTUS-Collection-v2.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk CACTUS-Collection-v2.0.0-debug.apk
          sha256sum CACTUS-Collection-v2.0.0.apk CACTUS-Collection-v2.0.0-debug.apk | tee apk-sha256.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v2.0.0-diagnostics
          path: |
            build-log.txt
            lint-log.txt
            apk-signature.txt
            apk-sha256.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload publish APK
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v2.0.0-publish-apk
          path: CACTUS-Collection-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cactus-collection-v2.0.0-debug-apk
          path: CACTUS-Collection-v2.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APK to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f CACTUS-Collection-v2.0.0.apk
          git commit -m "build: publish CACTUS Collection v2.0.0 APK [skip ci]" || true
          git push origin HEAD:main
